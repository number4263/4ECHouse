<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111827"><title>4ECHouse</title><style>
*{box-sizing:border-box}body{margin:0;font:14px system-ui,-apple-system,Segoe UI,sans-serif;color:#172033;background:#f5f7fb}button,input{font:inherit}button{cursor:pointer;border:0;background:none}.top{height:64px;background:#fff;border-bottom:1px solid #e5e9f0;display:flex;align-items:center;justify-content:space-between;padding:0 18px;position:fixed;inset:0 0 auto;z-index:5}.brand{display:flex;gap:10px;align-items:center;font-weight:800}.logo{background:#111827;color:#fff;border-radius:9px;padding:9px}.brand small{display:block;color:#8992a2;font-size:10px;font-weight:500}.side{position:fixed;top:64px;bottom:0;width:210px;background:#fff;border-right:1px solid #e5e9f0;padding:12px;z-index:4}.nav{width:100%;padding:11px;border-radius:8px;text-align:left;margin:2px 0;color:#697386}.nav.active,.nav:hover{background:#eef3ff;color:#2563d8;font-weight:700}.main{margin-left:210px;padding:92px 30px 40px}.page{max-width:1300px;margin:auto}.hero{background:#111827;color:#fff;border-radius:18px;padding:42px;min-height:320px;display:flex;justify-content:space-between;gap:30px}.hero h1{font-size:43px;margin:12px 0}.hero em{color:#a8c2ff;font-style:normal}.hero p{color:#cbd2de;max-width:650px;line-height:1.7}.primary,.secondary{padding:10px 14px;border-radius:8px;display:inline-block}.primary{background:#111827;color:#fff}.hero .primary{background:#fff;color:#111827}.secondary{background:#fff;border:1px solid #dfe4ec}.btns{display:flex;gap:8px}.panel{background:#fff;border:1px solid #e3e7ee;border-radius:12px;padding:18px}.grid4,.grid3{display:grid;gap:14px}.grid4{grid-template-columns:repeat(4,1fr)}.grid3{grid-template-columns:repeat(3,1fr)}h2{font-size:19px;margin:30px 0 14px}.card{background:#fff;border:1px solid #e3e7ee;border-radius:12px;padding:20px;text-align:left;min-height:145px}.card b{display:block;margin:10px 0 6px}.muted{color:#747e8e;line-height:1.5}.tabs{display:flex;border-bottom:1px solid #e3e7ee;margin:20px 0}.tab{padding:12px 14px;color:#70798a}.tab.active{color:#2563d8;border-bottom:2px solid #2563d8;font-weight:700}.designer{height:calc(100vh - 92px);display:grid;grid-template-columns:60px 1fr 240px;background:#fff;border:1px solid #e1e5ec;border-radius:12px;overflow:hidden}.rail{padding:8px;background:#fff;border-right:1px solid #e1e5ec}.rail button{width:44px;padding:9px 3px;margin:2px 0;border-radius:7px;font-size:10px}.rail button.active,.rail button:hover{background:#edf3ff;color:#2563d8}.work{position:relative;background:#eef1f5}.bar{height:38px;background:#fff;border-bottom:1px solid #e3e7ee;padding:10px;font-size:11px;color:#737c8c}.canvas{position:absolute;top:38px;bottom:0;left:0;right:0;background-image:linear-gradient(#d9dde5 1px,transparent 1px),linear-gradient(90deg,#d9dde5 1px,transparent 1px);background-size:20px 20px;touch-action:none}.room{position:absolute;border:2px solid #6f9ae8;background:#dce9ff99}.wall{position:absolute;height:10px;background:#202938;transform-origin:left center;border-radius:5px}.obj{position:absolute;background:#e8f5ff;border:1px solid #4b91b7;padding:4px 8px;font-size:10px;border-radius:3px}.prop{padding:16px}.prop input,.prop textarea{width:100%;padding:8px;border:1px solid #dfe4ec;border-radius:7px}.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#111827;color:#fff;padding:10px 15px;border-radius:8px;z-index:10}.search{padding:10px;border:1px solid #dfe4ec;border-radius:8px;width:100%;margin-bottom:15px}.list{display:grid;gap:8px}.item{background:#fff;border:1px solid #e3e7ee;border-radius:9px;padding:14px;text-align:left}.item b{display:block}.item small{color:#7a8494}.market{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.thumb{height:150px;background:linear-gradient(135deg,#d9e1e7,#f1ece5);border-radius:8px;margin-bottom:10px}.bottom{display:none}@media(max-width:900px){.side{width:72px}.side .nav{font-size:0;text-align:center}.main{margin-left:72px}.grid4{grid-template-columns:1fr 1fr}.grid3,.market{grid-template-columns:1fr 1fr}.designer{grid-template-columns:56px 1fr}.designer>.prop{display:none}}@media(max-width:650px){.top{height:58px}.side{top:auto;bottom:0;height:62px;width:100%;display:flex;padding:3px;border-top:1px solid #e3e7ee}.side .nav{font-size:9px;flex:1;padding:5px;text-align:center}.main{margin-left:0;padding:76px 10px 75px}.hero{padding:25px;min-height:350px}.hero h1{font-size:32px}.grid4,.grid3,.market{grid-template-columns:1fr}.designer{height:calc(100vh - 150px)}.top .secondary{font-size:0}}
</style></head><body><header class="top"><button class="brand" onclick="go('home')"><span class="logo">4E</span><span>4ECHouse<small>Thiết kế không gian Việt</small></span></button><button class="secondary" onclick="save()">Lưu dự án</button></header><aside class="side" id="nav"></aside><main class="main" id="app"></main><div id="toast"></div><script>
const nav=[['home','⌂','Trang chủ'],['unit','▦','Đơn vị của tôi'],['draw','✎','Vẽ nhà'],['interior','▣','Nội thất'],['tool','⚒','Công cụ'],['market','▤','Thị trường nhà'],['tutorial','?','Hướng dẫn']];let page='home',tool='select',rooms=[],walls=[],items=[];function esc(s){return s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}function toast(s){const x=document.getElementById('toast');x.className='toast';x.textContent=s;setTimeout(()=>x.className='',1800)}function go(p){page=p;render()}function save(){localStorage.setItem('4echouse',JSON.stringify({rooms,walls,items}));toast('Đã lưu dự án trên thiết bị')}function load(){try{let x=JSON.parse(localStorage.getItem('4echouse'));if(x){rooms=x.rooms||[];walls=x.walls||[];items=x.items||[]}}catch{}}function renderNav(){document.getElementById('nav').innerHTML=nav.map(n=>`<button class="nav ${page===n[0]?'active':''}" onclick="go('${n[0]}')">${n[1]}　${n[2]}</button>`).join('')}function render(){renderNav();let a=document.getElementById('app');a.innerHTML=pages[page]();if(page==='draw')bindCanvas()}const pages={home:()=>`<div class="page"><section class="hero"><div><small>PHIÊN BẢN TIẾNG VIỆT</small><h1>Thiết kế nhà <em>đơn giản hơn.</em></h1><p>Khảo sát, vẽ mặt bằng, bố trí nội thất và trình bày ý tưởng trên iPhone, iPad và máy tính.</p><div class="btns"><button class="primary" onclick="newProject()">+ Tạo dự án mới</button><button class="secondary" onclick="go('draw')">Mở trình vẽ</button></div></div></section><h2>Truy cập nhanh</h2><div class="grid4"><button class="card" onclick="go('draw')">✎<b>Vẽ mặt bằng</b><span class="muted">Tường, phòng, tầng và cấu trúc.</span></button><button class="card" onclick="go('interior')">▣<b>Thiết kế nội thất</b><span class="muted">Đồ nội thất và vật liệu.</span></button><button class="card" onclick="go('unit')">⌗<b>Khảo sát</b><span class="muted">LiDAR và đo Bluetooth.</span></button><button class="card" onclick="go('tool')">↗<b>Xuất hồ sơ</b><span class="muted">Ảnh, CAD, báo cáo.</span></button></div><h2>Quy trình</h2><div class="grid4"><div class="panel"><b>01 · Khảo sát</b></div><div class="panel"><b>02 · Vẽ mặt bằng</b></div><div class="panel"><b>03 · Bố trí nội thất</b></div><div class="panel"><b>04 · Trình bày & xuất</b></div></div></div>`,unit:()=>`<div class="page"><h1>Đơn vị của tôi</h1><p class="muted">Quản lý mặt bằng và dữ liệu khảo sát.</p><div class="tabs"><button class="tab active">Mặt bằng đơn vị mới</button><button class="tab">Các mẫu đơn vị</button><button class="tab">Mặt bằng đã nhận</button><button class="tab">Khôi phục dữ liệu</button><button class="tab">Chuyển giao mặt bằng</button></div><div class="grid3"><button class="card" onclick="newProject()">✎<b>Vẽ mặt bằng</b><span class="muted">Vẽ thủ công từ kích thước thực tế.</span></button><button class="card" onclick="toast('Chọn tệp mặt bằng')">⇧<b>Tải mặt bằng lên</b><span class="muted">Nhập ảnh hoặc bản vẽ làm nền.</span></button><button class="card" onclick="toast('LiDAR sẽ được tích hợp trong bản native')">⌁<b>Quét LiDAR</b><span class="muted">Dùng cảm biến LiDAR trên thiết bị tương thích.</span></button></div></div>`,draw:()=>`<div class="designer"><div class="rail">${[['select','Chọn'],['wall','Tường'],['room','Phòng'],['door','Cửa'],['window','Cửa sổ'],['measure','Đo']].map(x=>`<button class="${tool===x[0]?'active':''}" onclick="setTool('${x[0]}')">${x[1]}</button>`).join('')}<hr><button onclick="newProject()">Xóa</button></div><div class="work"><div class="bar">Nhà phố mẫu · Tầng 1 · Đơn vị mm</div><div class="canvas" id="canvas"></div></div><div class="prop"><h3>Thuộc tính</h3><p class="muted">Chọn đối tượng để chỉnh sửa. Dùng công cụ <b>Tường</b> hoặc <b>Phòng</b> rồi kéo trên vùng vẽ.</p><hr><b>Thống kê</b><p>Phòng: ${rooms.length}</p><p>Tường: ${walls.length}</p><p>Đối tượng: ${items.length}</p><button class="secondary" onclick="toast('Đang chuẩn bị xuất CAD...')">Xuất hồ sơ</button></div></div>`,interior:()=>`<div class="page"><h1>Thiết kế nội thất</h1><p class="muted">Bố trí đồ nội thất và vật liệu.</p><div class="grid3">${['Sofa 3 chỗ','Bàn ăn 6 ghế','Giường đôi','Tủ quần áo','Bàn làm việc','Tivi treo tường'].map(x=>`<button class="card" onclick="items.push({label:'${x}'});toast('Đã thêm ${x}');render()">▣<b>${x}</b><span class="muted">Thêm vào thiết kế</span></button>`).join('')}</div><h2>Vật liệu</h2><div class="grid4">${['Sơn trắng','Gỗ sồi sáng','Đá marble','Gạch terrazzo'].map(x=>`<button class="card" onclick="toast('Đã chọn ${x}')">◼<b>${x}</b></button>`).join('')}</div></div>`,tool:()=>`<div class="page"><h1>Công cụ</h1><p class="muted">Khảo sát, Panorama 720° và quản lý vật liệu.</p><div class="grid3"><button class="card" onclick="toast('Mở chụp nhanh')">◉<b>Chụp nhanh</b><span class="muted">Ảnh hiện trạng hoặc góc nhìn thiết kế.</span></button><button class="card" onclick="toast('Mở Panorama 720°')">◎<b>Panorama 720°</b><span class="muted">Vật liệu panorama · Tác phẩm · Cài đặt logo, liên hệ.</span></button><button class="card" onclick="toast('Mở quản lý vật liệu')">▤<b>Quản lý vật liệu</b><span class="muted">Thư viện vật liệu của dự án.</span></button></div></div>`,market:()=>`<div class="page"><h1>Thị trường nhà</h1><p class="muted">Kho mẫu tham khảo.</p><input class="search" placeholder="Tìm mẫu nhà, nội thất..." oninput="filterMarket(this.value)"><div class="market" id="market">${['Nhà phố hiện đại','Căn hộ 2 phòng ngủ','Nhà phố 3 tầng','Biệt thự tối giản','Phòng khách Japandi','Bếp chữ L'].map((x,i)=>`<button class="card"><div class="thumb"></div><b>${x}</b><span class="muted">${75+i*18} m² · Mẫu tham khảo</span></button>`).join('')}</div></div>`,tutorial:()=>`<div class="page"><h1>Hướng dẫn sử dụng</h1><p class="muted">Toàn bộ danh mục được trình bày bằng tiếng Việt.</p><input class="search" id="ts" placeholder="Tìm bài hướng dẫn..." oninput="filterTut(this.value)"><div class="list" id="tut">${tuts.map((x,i)=>`<button class="item"><small>${x[0]}</small><b>${x[1]}</b><small>${x[2]}</small></button>`).join('')}</div></div>`};const tuts=[['Bắt đầu','Tạo tài khoản 4ECHouse','Thiết lập tài khoản và dự án'],['Bắt đầu','Học nhanh cách vẽ nhà','Từ mặt bằng trống đến căn nhà'],['Bắt đầu','Học nhanh thiết kế nội thất','Đặt đồ và vật liệu'],['Vẽ nhà','Giới thiệu giao diện vẽ','Thanh công cụ và vùng làm việc'],['Vẽ nhà','Thêm cấu trúc công trình','Tường, cửa, cửa sổ'],['Vẽ nhà','Điều chỉnh chiều cao tường','Thiết lập cao độ'],['Vẽ nhà','Chỉnh sửa tường nghiêng','Đổi góc và kích thước'],['Vẽ nhà','Vẽ tường cong','Tạo cấu trúc cong'],['Vẽ nhà','Sử dụng con trỏ','Định vị và bắt điểm'],['Vẽ nhà','Không gian nhiều tầng','Tạo không gian theo tầng'],['Vẽ nhà','Vẽ toàn bộ không gian','Khép kín mặt bằng'],['Vẽ nhà','Vẽ một phòng đơn','Tạo nhanh một phòng'],['Vẽ nhà','Chỉnh sửa không gian nhiều tầng','Điều chỉnh phòng'],['Vẽ nhà','Vẽ căn hộ nhiều tầng','Tổ chức nhiều tầng'],['Vẽ nhà','Di chuyển và ghép phòng','Căn chỉnh phòng'],['Đo đạc','Khảo sát thực tế','Đo và ghi nhận hiện trạng'],['Đo đạc','Kết nối máy đo Bluetooth','Nhận số đo từ thiết bị'],['Nội thất','Ốp vật liệu hoàn thiện','Tường, sàn, trần'],['Nội thất','Thay vật liệu nội thất','Thay vật liệu đồ dùng'],['Nội thất','Lát sàn và đá ngưỡng','Khu vực lát'],['Nội thất','Màu ngoại thất','Thiết lập màu ngoài nhà'],['Nội thất','Trần treo hai cấp','Tạo trần giật cấp'],['Nội thất','Hốc trang trí (Niche)','Tạo hốc âm tường'],['Nội thất','Đèn tuyến tính','Đặt đèn LED'],['Nội thất','Đo nhà bằng 4ECHouse','Kết hợp số đo'],['Nội thất','Lát gạch sàn','Mẫu và hướng lát'],['Nội thất','Đổi vật liệu mô hình 3D','Thay vật liệu model'],['Xuất hồ sơ','Tạo ảnh phối cảnh','Góc nhìn và hình ảnh'],['Xuất hồ sơ','Xuất CAD','Xuất mặt bằng'],['Xuất hồ sơ','Phân tích ánh sáng mặt trời','Kiểm tra hướng nắng'],['Xuất hồ sơ','Ghi nhận hiện trường','Nhật ký khảo sát']];function newProject(){rooms=[];walls=[];items=[];go('draw');toast('Đã tạo dự án mới')}function setTool(x){tool=x;render()}function bindCanvas(){let c=document.getElementById('canvas'),s=null;c.onpointerdown=e=>{if(!['wall','room','door','window'].includes(tool))return;let r=c.getBoundingClientRect();s={x:e.clientX-r.left,y:e.clientY-r.top};c.setPointerCapture(e.pointerId)};c.onpointerup=e=>{if(!s)return;let r=c.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top;if(tool==='room')rooms.push({x:Math.min(x,s.x),y:Math.min(y,s.y),w:Math.abs(x-s.x),h:Math.abs(y-s.y)});else if(tool==='wall'){let dx=x-s.x,dy=y-s.y,len=Math.hypot(dx,dy),ang=Math.atan2(dy,dx)*180/Math.PI;walls.push({x:s.x,y:s.y,len,ang})}else items.push({x,y,label:tool==='door'?'Cửa':'Cửa sổ'});s=null;render()};rooms.forEach(r=>{let e=document.createElement('div');e.className='room';Object.assign(e.style,{left:r.x+'px',top:r.y+'px',width:r.w+'px',height:r.h+'px'});c.appendChild(e)});walls.forEach(w=>{let e=document.createElement('div');e.className='wall';Object.assign(e.style,{left:w.x+'px',top:w.y+'px',width:w.len+'px',transform:`rotate(${w.ang}deg)`});c.appendChild(e)});items.forEach(i=>{let e=document.createElement('div');e.className='obj';e.textContent=i.label;Object.assign(e.style,{left:i.x+'px',top:i.y+'px'});c.appendChild(e)})}function filterTut(q){let z=q.toLowerCase();document.querySelectorAll('#tut .item').forEach(e=>e.style.display=e.textContent.toLowerCase().includes(z)?'block':'none')}function filterMarket(q){let z=q.toLowerCase();document.querySelectorAll('#market .card').forEach(e=>e.style.display=e.textContent.toLowerCase().includes(z)?'block':'none')}load();render();
</script></body></html>
